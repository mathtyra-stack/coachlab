<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>envolvi · Personal Trainer OS</title>
<link rel="icon" href="data:image/svg+xml,<svg viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'><rect width='40' height='40' rx='9' fill='%231A2B4A'/><path d='M12 10L28 10M12 10L12 30M12 20L24 20M12 30L28 30' stroke='%234A7C59' stroke-width='2.8' stroke-linecap='round' fill='none'/></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Instrument+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F7F5F0;--bg2:#ffffff;--surface:#FAFAF7;--surface2:#F0EEE6;
  --border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.14);
  --text:#1A2B4A;--text2:#4A5568;--text3:#8A8B7E;
  --accent:#4A7C59;--accent2:#2D5F3F;--accent-bg:rgba(74,124,89,.1);
}
body{font-family:'Instrument Sans','Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

/* ── Auth Card ──────────────────────────────────────────── */
.auth-card{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:36px 40px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,.4)}
@media(max-width:480px){
  body{background:var(--bg2);padding:0;align-items:flex-start}
  .auth-card{border:none;border-radius:0;box-shadow:none;max-width:100%;padding:60px 28px 40px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
}

/* ── Logo ───────────────────────────────────────────────── */
.auth-logo{font-family:'Inter','Instrument Sans',sans-serif;font-weight:500;font-size:20px;letter-spacing:-.4px;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:10px}
.auth-logo-icon{width:32px;height:32px;border-radius:8px;display:inline-flex;flex-shrink:0}
.auth-logo-icon svg{width:100%;height:100%;display:block}
.auth-tagline{font-size:12px;color:var(--text3);margin-bottom:28px;text-align:center}
.auth-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:22px;color:var(--text);margin-bottom:4px;text-align:center}
.auth-sub{font-size:12px;color:var(--text3);margin-bottom:24px;line-height:1.5;text-align:center}

/* ── Entry Cards ────────────────────────────────────────── */
.entry-cards{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.entry-card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:18px;text-align:left;display:flex;align-items:center;gap:14px;transition:border-color .15s,box-shadow .15s;cursor:pointer;color:var(--text);width:100%;text-decoration:none;font-family:inherit;font-size:inherit}
.entry-card:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(74,124,89,.08)}
.entry-card-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--accent-bg);color:var(--accent)}
.entry-card-text{flex:1;min-width:0}
.entry-card-title{font-weight:600;font-size:15px;margin-bottom:2px}
.entry-card-sub{font-size:12px;color:var(--text3)}
.entry-card-arrow{color:var(--text3);font-size:18px;flex-shrink:0}

/* ── Footer ─────────────────────────────────────────────── */
.auth-footer{text-align:center;margin-top:28px;font-size:11px;color:var(--text3);letter-spacing:.3px}
</style>
</head>
<body>

<div class="auth-card">
  <div class="auth-logo">
    <span class="auth-logo-icon">
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-label="envolvi">
        <rect x="0" y="0" width="40" height="40" rx="9" fill="#1A2B4A"/>
        <path d="M 12 10 L 28 10 M 12 10 L 12 30 M 12 20 L 24 20 M 12 30 L 28 30" stroke="#4A7C59" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      </svg>
    </span>
    envolvi
  </div>
  <div class="auth-tagline">Personal Trainer OS</div>
  <div class="auth-title" style="margin-top:24px">Bem-vindo!</div>
  <div class="auth-sub" style="margin-bottom:24px">Como você quer entrar?</div>

  <div class="entry-cards">
    <a href="./coach.html?go=login" class="entry-card">
      <div class="entry-card-icon">⚙️</div>
      <div class="entry-card-text">
        <div class="entry-card-title">Sou personal trainer</div>
        <div class="entry-card-sub">Acessar painel de gestão</div>
      </div>
      <div class="entry-card-arrow">→</div>
    </a>
    <a href="./aluno.html?go=login" class="entry-card">
      <div class="entry-card-icon">👤</div>
      <div class="entry-card-text">
        <div class="entry-card-title">Sou aluno</div>
        <div class="entry-card-sub">Acessar meus treinos</div>
      </div>
      <div class="entry-card-arrow">→</div>
    </a>
  </div>

  <div class="auth-footer">envolvi · Versão 1.0</div>
</div>

</body>
</html>
